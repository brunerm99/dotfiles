<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong"><family>serif</family><prefer><family>IBM Plex Serif</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>IBM Plex Serif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>IBM Plex Mono</family></prefer></alias>
</fontconfig>
