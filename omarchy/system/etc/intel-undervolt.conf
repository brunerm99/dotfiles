# CPU undervolt for the i7-8650U in odell. Installed as /etc/intel-undervolt.conf.
#
# Starting values are conservative. Step CPU and CPU Cache together by 10 mV
# at a time (they share a rail on this CPU) and re-test after every step.
# A freeze or sudden reboot means the last step was too far: the offset is
# lost on power-off, so back off 10–20 mV before applying again.

# Triggers for elogind; unused on systemd.
enable no

# undervolt ${index} ${display_name} ${millivolts}
undervolt 0 'CPU' -70
undervolt 1 'GPU' 0
undervolt 2 'CPU Cache' -70
undervolt 3 'System Agent' 0
undervolt 4 'Analog I/O' 0

# Only used by intel-undervolt-loop.service, which is not enabled.
interval 5000
daemon undervolt:once
