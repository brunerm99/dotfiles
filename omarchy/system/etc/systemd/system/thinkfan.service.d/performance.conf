[Service]
# Check temperatures at least every 2 s. The negative bias (-b-5) halves a
# sudden jump and lets it back in over about 10 s, so one-second bursts do not
# flip the fan to full speed and back. Sorts after the packaged override.conf,
# so this value wins.
Environment='THINKFAN_ARGS=-b-5 -s2'
